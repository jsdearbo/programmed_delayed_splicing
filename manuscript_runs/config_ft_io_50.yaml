# =============================================================================
# Main Fig 6a — Intron only, 50 slowest-splicing introns
# =============================================================================

# ---------------------------------------------------------------------------
# Shared settings
# ---------------------------------------------------------------------------
experiment_dir: results/fig6a_intron_only_bottom50
coord_file_path: manuscript_runs/bottom_50_introns.csv
gtf_file:        /path/to/gencode.vM23.annotation.gtf   # download: see README
species:         mouse
model_selection: fine_tuned
checkpoint_path: weights/borzoi_mm10_delayed_splicing_finetuned.ckpt  # download: see README
task_id:         ENCFF575SGC

# ---------------------------------------------------------------------------
# Step 1: Get Attributions
# ---------------------------------------------------------------------------
centering_mode:       intron_only
attr_respect_to:      intron_only
attribution_method:   inputxgradient
name_col:             intron_name

# ---------------------------------------------------------------------------
# Step 2: Run MoDISco
# ---------------------------------------------------------------------------
mask_mode:       intron_only
flank:           [-5]
modisco_len:     5000
groupby_column:  null

# ---------------------------------------------------------------------------
# Step 3: Enrichment Analysis
# ---------------------------------------------------------------------------
dedupe_overlaps: true

enrichment:
  run_sea:  true
  run_fimo: true
  source_subset: "all_seqs_modisco"
  source_flank:  "masked_-5bp_flank"
  # TNF control FASTA — generate once with:
  #   python scripts/generate_control_fasta.py \
  #       --config manuscript_runs/config_ft_io_50.yaml \
  #       --use-tnf-list \
  #       --output manuscript_runs/tnf_controls_seqs.fa
  control_fasta: manuscript_runs/tnf_controls_seqs.fa
  comparisons:
    - primary: "all"
      control: "tnf_controls"

# ---------------------------------------------------------------------------
# Step 4: Map Motifs
# ---------------------------------------------------------------------------
bigwig_dir: /path/to/timecourse_bigwigs   # tc8 timecourse RNA-seq BigWigs (bw_no_norm)

motif_mapping:
  modisco_window:   5000
  model_seq_len:    524288
  selection_method: modiscolite
  attr_respect_to:  intron_only
  plot:
    modes:   ["combined", "separate"]
    figsize: [20, 1.5]
    topN:    5
    colors:
      pos: royalblue
      neg: crimson
